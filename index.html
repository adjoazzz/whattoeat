<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>What's Eat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..700,100&family=Inter:opsz,wght@14..32,400..700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one white rounded card on a light-grey ground. Onboarding is a centred column; the weekly plan is a wide day-by-meal grid. */
:root{
  --brand:#F1AB1A;
  --brand-deep:#D98F00;
  --brand-tint:#FEF7E8;
  --brand-line:#F9E8C6;
  --ground:#EDEDED;
  --card:#FFFFFF;
  --field:#F4F4F4;
  --ink:#1F1F1F;
  --muted:#8A8A8A;
  --line:#E6E6E6;
  --green:#07B670;
  --tomato:#D94120;
  --f-logo:'Fredoka','Baloo 2','Nunito',system-ui,sans-serif;
  --f-head:'Recoleta','Fraunces','Georgia',serif;
  --f-body:'Inter Display','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-num:'Oswald','Arial Narrow',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:auto}
body{margin:0;font-optical-sizing:none;font-variation-settings:'opsz' 32;background:var(--card);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;padding:0;min-height:100vh}
button{font:inherit;font-variation-settings:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;font-variation-settings:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.card{background:var(--card);border-radius:0;width:100%;margin:0;padding-block:28px 48px;padding-left:max(48px,env(safe-area-inset-left,0px));padding-right:max(48px,env(safe-area-inset-right,0px));min-height:100vh;position:relative;display:flex;flex-direction:column}
.logo{font-family:var(--f-logo);font-weight:700;color:var(--brand);font-size:24px;letter-spacing:.01em;line-height:1;display:inline-flex;align-items:flex-start;gap:3px;user-select:none}
.logo .l2{position:relative;top:.52em;font-size:.88em}
.logo svg{margin-top:.55em;width:9px;height:12px}
.center{width:100%;max-width:470px;margin:auto;display:flex;flex-direction:column;align-items:center;text-align:center;padding-block:12px}
.art{display:block;margin:0 auto 14px}
.art img{display:block;max-width:100%;height:auto}
.tart img,.gh img{display:block;width:100%;height:100%;object-fit:contain}
.logo-img{display:block;height:auto}
h1{font-family:var(--f-head);font-variation-settings:'SOFT' 100,'WONK' 0;font-weight:600;font-size:21px;line-height:1.25;margin:0 0 8px;text-wrap:balance}
.sub{color:#6a6a6a;font-size:13px;margin:0 0 22px;max-width:520px;text-wrap:pretty}
.field{width:100%;text-align:left;margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;margin-bottom:6px}
.inp{width:100%;height:40px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:0 12px;font-size:13px}
.inp::placeholder{color:#b3b3b3}
.inp.bad{border-color:var(--tomato)}
.err{color:var(--tomato);font-size:12px;margin:-6px 0 10px;text-align:left;width:100%;min-height:0}
.btn{border:0;border-radius:8px;height:40px;padding:0 18px;font-weight:600;font-size:13px;background:#fff;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:#cfcfcf}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-deep);border-color:var(--brand-deep)}
.btn.pri[disabled]{opacity:.45;cursor:not-allowed}
.btn.full{width:100%}
.btn.pill{border-radius:999px;height:34px;padding:0 22px;font-size:12.5px}
.or{display:flex;align-items:center;gap:12px;width:100%;color:#b0b0b0;font-size:11px;margin:16px 0}
.or:before,.or:after{content:"";height:1px;background:var(--line);flex:1}
.btn.google{height:38px;font-weight:500;font-size:12.5px}
.back{position:absolute;left:48px;top:84px;border:1px solid var(--line);background:#fff;border-radius:999px;height:26px;padding:0 12px 0 8px;font-size:11.5px;display:inline-flex;align-items:center;gap:4px;color:#444}
.actions{display:flex;justify-content:space-between;width:100%;margin-top:34px}
/* meal-time picker */
.times{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:760px;margin-top:6px;text-align:left}
.tcard{background:#F7F7F7;border:1.5px solid transparent;border-radius:12px;padding:16px 16px;display:flex;align-items:center;gap:12px;position:relative;min-height:84px}
.tcard.on{border-color:var(--brand);background:var(--brand-tint)}
.tcard .meta{flex:1;min-width:0}
.tcard .nm{font-size:13px;font-weight:600;margin-bottom:8px;display:block}
.tcard input.nmi{border:0;border-bottom:1px dashed #cfcfcf;background:transparent;font-weight:600;font-size:13px;width:100%;padding:0 0 2px;margin-bottom:8px}
.chk{width:18px;height:18px;border-radius:50%;border:1.5px solid #c9c9c9;background:#fff;flex:none;display:grid;place-items:center;padding:0;align-self:flex-start;margin-top:2px}
.tcard.on .chk{background:var(--brand);border-color:var(--brand)}
.tcard.on .chk:after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.rng{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
.rng input{height:28px;border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:12px;background:#fff;width:96px}
.tart{flex:none;width:44px;height:44px}
.addc{margin:22px 0 0;align-self:flex-start;border:0;background:none;font-size:12.5px;color:#444;display:inline-flex;gap:8px;align-items:center;padding:4px 0}
.addc b{font-size:16px;line-height:1;font-weight:500}
/* foods */
.wide{max-width:700px}
.mealrow{display:flex;gap:12px;width:100%;align-items:flex-end;position:relative;z-index:10;text-align:left}
.mealrow .grow{flex:1;min-width:0}
.mealrow label{font-size:11.5px;font-weight:600;display:block;margin-bottom:6px}
.mealrow .inp{background:var(--field);border-color:transparent;height:38px}
.typebtn{height:38px;border:0;background:transparent;font-size:12px;color:#444;display:inline-flex;align-items:center;gap:6px;padding:0 4px;white-space:nowrap}
.typebtn .dots{display:inline-flex;gap:3px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.menu{position:absolute;right:0;top:100%;margin-top:6px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;width:190px;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.menu button{display:flex;width:100%;justify-content:space-between;align-items:center;border:0;background:none;padding:8px 10px;border-radius:6px;font-size:12px;text-align:left}
.menu button:hover{background:#f6f6f6}
.menu button.sel{font-weight:600}
.menu .dot{width:9px;height:9px}
.menu .dot.ring{background:transparent!important;border:1.5px solid currentColor}
.added{width:100%;text-align:left;margin-top:22px}
.added h3{font-size:12px;margin:0 0 8px;display:flex;align-items:center;gap:8px;font-weight:600}
.badge{background:var(--brand);color:#fff;border-radius:999px;font-size:10px;min-width:18px;height:18px;display:inline-grid;place-items:center;padding:0 5px}
.chips{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;min-height:64px;align-content:flex-start}
.chip{background:#F2F2F2;border-radius:999px;padding:5px 8px 5px 10px;display:inline-flex;align-items:center;gap:6px;font-size:11.5px}
.chip .x{border:0;background:none;color:#888;font-size:13px;line-height:1;padding:0 2px}
.chip .x:hover{color:var(--tomato)}
.empty{color:#a8a8a8;font-size:12px;align-self:center;padding:4px 2px}
.linkb{border:0;background:none;color:var(--brand-deep);font-weight:600;font-size:12px;padding:0}
.legend{position:absolute;right:-170px;top:0}
/* plan */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:24px}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:relative}
.tools .btn{height:34px;font-size:12px;padding:0 14px;border-radius:7px}
.icb{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;padding:0}
.me{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 3px;background:#fff;font-size:12px}
.av{width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;font-weight:600;font-size:11px;display:grid;place-items:center}
.pm{position:absolute;right:0;top:100%;margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;min-width:180px;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.pm button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:6px;font-size:12.5px}
.pm button:hover{background:#f6f6f6}
.scroller{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.grid{display:grid;min-width:680px}
.gh{padding:14px 18px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);background:#FBFBFB;display:flex;gap:10px;align-items:center;min-height:62px}
.gh:first-child{border-left:0}
.gh svg{width:26px;height:26px;flex:none}
.gh .n{font-weight:700;font-size:13px;line-height:1.2}
.gh .t{font-size:11px;color:var(--muted)}
.gd{padding:0 18px;display:flex;gap:16px;align-items:center;font-size:11.5px;color:#777;letter-spacing:.04em;border-bottom:1px solid var(--line);min-height:62px}
.gd b{font-weight:500}
.gd span.num{color:#777}
.gc{border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:9px 14px 9px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:62px}
.gc:hover{background:#FAFAFA}
.gcm{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:3px;background:none;border:0;padding:0;text-align:right}
.gc.done{background:#EEF9F3}
.gc.done .m{color:#0A7A4E}
.eatw{display:flex;align-items:center;gap:7px;flex:none}
.eat{width:26px;height:26px;border-radius:50%;border:1.5px solid #cfcfcf;background:#fff;flex:none;display:grid;place-items:center;padding:0;transition:transform .15s,background .15s,border-color .15s}
.eat:hover:not([disabled]){border-color:var(--green);transform:scale(1.1)}
.eat svg{width:13px;height:13px;opacity:0}
.eat.on{background:var(--green);border-color:var(--green)}
.eat.on svg{opacity:1}
.eat[disabled]{cursor:default}
.eat.pop{animation:popin .45s cubic-bezier(.3,1.6,.5,1)}
.ask{font-size:10px;font-weight:600;color:var(--brand-deep);white-space:nowrap}
.ask.ok{color:#0A7A4E}
.gc .m{font-size:12px;font-weight:600}
.gc .meta{display:flex;align-items:center;gap:10px;font-size:10px;color:#8a8a8a}
.gc .meta span{display:inline-flex;align-items:center;gap:3px}
.gc .tag{border:1px solid var(--brand);background:var(--brand-line);color:#A56B00;border-radius:4px;padding:1px 6px;font-size:10px;font-weight:500}
.gc .add{color:#b0b0b0;font-weight:500}
.today .gd,.today .gc{background:var(--brand-tint)}
.today .gd{color:var(--brand-deep)}
.today .gc:hover{background:#FDF0D2}
.last{border-bottom:0!important}
.note{margin:14px 2px 0;font-size:11.5px;color:var(--muted)}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(20,20,20,.38);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:#fff;border-radius:16px;width:100%;max-width:440px;padding:24px;max-height:86vh;overflow:auto}
.dlg h2{font-family:var(--f-head);font-variation-settings:'SOFT' 100,'WONK' 0;font-size:19px;margin:0 0 4px;font-weight:600}
.dlg p{margin:0 0 16px;color:#6a6a6a;font-size:12.5px}
.dlg .row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:12.5px;text-align:left}
.opt:hover{border-color:var(--brand)}
.opt.cur{border-color:var(--brand);background:var(--brand-tint)}
.ml h4{margin:16px 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ml label{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #f1f1f1;font-size:12.5px;cursor:pointer}
.ml label small{margin-left:auto;color:var(--muted);font-size:11px}
.ml input{accent-color:var(--brand);width:16px;height:16px}
.ml input:checked + span{text-decoration:line-through;color:#aaa}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;border-radius:999px;padding:10px 18px;font-size:12.5px;z-index:80}

/* game layer */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:16px}
.stepper{white-space:nowrap;display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--muted);font-weight:600}
.stepper .bars{display:flex;gap:5px}
.stepper .bars i{width:30px;height:6px;border-radius:99px;background:#EADFC8}
.stepper .bars i.on{background:var(--brand)}
.goal{width:100%;margin-top:14px;text-align:left}
.bar{height:8px;border-radius:99px;background:#F1E3C2;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .5s}
.goal .bar{margin:0 0 6px}
.goal .gt{font-size:11.5px;color:#6a6a6a;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.goal .gt b{color:#0A7A4E}
.chip.pop{animation:popin .35s cubic-bezier(.3,1.6,.5,1)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:12px}
.sc{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff;display:flex;gap:14px;align-items:center;min-width:0}
.sc.lv{background:var(--brand-tint);border-color:var(--brand-line)}
.sc small,.ql{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.big{font-family:var(--f-head);font-variation-settings:'SOFT' 100,'WONK' 0;font-size:20px;font-weight:600;line-height:1.15}
.xt{font-size:11px;color:#7a7a7a}
.sdots{display:flex;gap:4px;margin-top:7px}
.sd{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:600;background:#F1F1F1;color:#9a9a9a}
.sd.on{background:var(--brand);color:#fff}
.sd.now{outline:2px solid var(--brand-line)}
.flamebig svg{width:34px;height:38px;display:block}
.ring{position:relative;width:62px;height:62px;flex:none}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:12px}
.quest{display:flex;align-items:center;gap:16px;border:1px solid var(--brand-line);background:#FFFCF4;border-radius:14px;padding:12px 18px;margin-bottom:16px;flex-wrap:wrap}
.quest img.mas{width:92px;height:auto;flex:none}
.quest .txt{flex:1;min-width:220px}
.quest .txt b{font-family:var(--f-head);font-variation-settings:'SOFT' 100,'WONK' 0;font-size:17px;font-weight:600;display:block;margin:2px 0}
.quest .txt span.p{font-size:12px;color:#666}
.pips{display:flex;gap:8px;margin-top:9px;align-items:center;flex-wrap:wrap}
.pip{width:32px;height:32px;border-radius:50%;border:1.5px dashed #d6d6d6;display:grid;place-items:center;padding:4px;background:#fff}
.pip img{width:100%;height:100%;object-fit:contain;filter:grayscale(1);opacity:.5}
.pip.on{border:1.5px solid var(--green);background:#EEF9F3}
.pip.on img{filter:none;opacity:1}
.bbtn{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font-size:12px;font-weight:600}
.bbtn:hover{border-color:var(--brand)}
.bstack{display:flex}
.bstack img{width:28px;height:28px;object-fit:contain;margin-left:-6px;background:#fff;border-radius:50%;border:1.5px solid #fff}
.bstack img:first-child{margin-left:0}
.bstack img.lock{filter:grayscale(1);opacity:.4}
.bgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.bcard{border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;font-size:11.5px}
.bcard img{width:64px;height:56px;object-fit:contain;display:block;margin:0 auto 6px}
.bcard.lock img{filter:grayscale(1);opacity:.35}
.bcard b{display:block;font-size:12.5px}
.bcard span{color:var(--muted)}
.badgepop{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#fff;border:1.5px solid var(--brand);border-radius:16px;padding:10px 18px 10px 10px;display:flex;gap:12px;align-items:center;z-index:95;box-shadow:0 10px 30px rgba(241,171,26,.3);animation:dropin .45s cubic-bezier(.3,1.5,.5,1);max-width:calc(100vw - 32px)}
.badgepop.out{opacity:0;transform:translateX(-50%) translateY(-12px);transition:all .3s}
.badgepop img{width:52px;height:46px;object-fit:contain;flex:none}
.badgepop small{display:block;color:var(--brand-deep);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.badgepop b{display:block;font-family:var(--f-head);font-variation-settings:'SOFT' 100,'WONK' 0;font-size:16px}
.badgepop span{font-size:11.5px;color:#666}
.xppop{position:fixed;font-weight:700;color:var(--brand-deep);font-size:15px;pointer-events:none;z-index:96;animation:floatup 1s ease-out forwards;text-shadow:0 1px 0 #fff;white-space:nowrap}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}
.lvl{text-align:center}
.lvl img{width:150px;height:auto;display:block;margin:0 auto 8px}
.lvl .row{justify-content:center}
.rolling{color:#b9b9b9!important}
@keyframes popin{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes dropin{from{opacity:0;transform:translateX(-50%) translateY(-24px)}to{opacity:1;transform:translateX(-50%)}}
@keyframes floatup{from{opacity:1;transform:translate(-50%,-8px)}to{opacity:0;transform:translate(-50%,-56px)}}
@keyframes cellin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.reveal .chip2{animation:cellin .45s ease backwards;animation-delay:calc(var(--i,0)*30ms)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* world map */
.sc,.quest,.bbtn{border:2px solid #1B1B1B;box-shadow:0 4px 0 #1B1B1B}
.bbtn:hover{border-color:#1B1B1B;transform:translateY(1px)}
.scene{--ink:#1B1B1B;position:relative;border-radius:22px;overflow:clip;padding:18px 90px 34px 18px;background:linear-gradient(180deg,var(--sky1),var(--sky2) 45%,var(--sky3));border:2px solid var(--ink)}
.scene::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.6;background-repeat:repeat-y;background-size:100% 1000px;
  background-image:radial-gradient(ellipse 55% 11% at 0% 14%,var(--hill1) 0 97%,transparent 100%),radial-gradient(ellipse 50% 10% at 100% 42%,var(--hill2) 0 97%,transparent 100%),radial-gradient(ellipse 46% 9% at 4% 74%,var(--hill2) 0 97%,transparent 100%),radial-gradient(ellipse 52% 10% at 100% 96%,var(--hill1) 0 97%,transparent 100%)}
.scene[data-theme=meadow]{--sky1:#E2F6BF;--sky2:#ABDD7C;--sky3:#7CC65A;--hill1:#5FB04A;--hill2:#4E9E3F;--path:#EAF6C4;--path-edge:#B4D77C;--stone:#FAFDE8;--d1:#3E9A3C;--d2:#2F7D32;--d3:#8A5A2B;--cloud:#fff}
.scene[data-theme=dusk]{--ink:#1D0F4F;--sky1:#8062E4;--sky2:#5A3CC0;--sky3:#432A9E;--hill1:#6A4BD0;--hill2:#8466E6;--path:#BBA9F6;--path-edge:#8C75E0;--stone:#E2D8FF;--d1:#FFD86B;--d2:#4A2FA6;--d3:#fff;--cloud:#9C86EC}

function dname(){const e=(S.user&&S.user.email)||'';const base=e.split('@')[0].replace(/[0-9]+/g,'');const parts=base.split(/[._-]+/).filter(Boolean);if(!parts.length)return 'Guest';return parts.map(p=>p[0].toUpperCase()+p.slice(1)).join(' ')}

function dots(ids){return ids.map(id=>{const t=typeById(id);return t?`<span class="dot" style="background:${t.color}"></span>`:''}).join('')}

/* ---------- plan logic ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function generate(){
  const plan={};
  activeTypes().forEach(t=>{
    const pool=S.meals.filter(m=>m.types.includes(t.id)).map(m=>m.id);
    const out=[];let bag=[];
    if(pool.length){for(let d=0;d<7;d++){
      if(!bag.length)bag=shuffle(pool);
      if(bag.length>1&&bag[bag.length-1]===out[d-1]){[bag[0],bag[bag.length-1]]=[bag[bag.length-1],bag[0]]}
      out.push(bag.pop());
    }}
    plan[t.id]=out.length?out:new Array(7).fill(null);
  });
  const old=S.plan;if(old)Object.keys(plan).forEach(t=>{if(old[t])old[t].forEach((v,d)=>{if(v===NONE)plan[t][d]=NONE})});
  S.plan=plan;save();
}
function weekDates(){const n=new Date();const off=(n.getDay()+6)%7;return DAYS.map((_,i)=>{const d=new Date(n.getFullYear(),n.getMonth(),n.getDate()-off+i);return d})}
const mealById=id=>S.meals.find(m=>m.id===id);
const NONE='none';
function hasMeal(t,i){const v=S.plan&&S.plan[t]&&S.plan[t][i];return !!v&&v!==NONE}
function skippedOn(dk,t){if(!S.plan||!S.plan[t])return false;const i=weekDates().findIndex(d=>dkey(d)===dk);return i>=0&&S.plan[t][i]===NONE}

const XP_PER_LEVEL=100;

const pad2=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const levelOf=xp=>Math.floor(xp/XP_PER_LEVEL)+1;

const reduced=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function eatenDates(){const m={};Object.keys(S.game.eaten).forEach(k=>{if(S.game.eaten[k]){const p=k.split('|');(m[p[0]]=m[p[0]]||new Set()).add(p[1])}});return m}
function eatenCount(){return Object.values(S.game.eaten).filter(Boolean).length}
function cleanDays(){const act=activeTypes().map(t=>t.id);if(!act.length)return 0;return Object.entries(eatenDates()).filter(([dk,set])=>act.every(id=>set.has(id)||skippedOn(dk,id))).length}
function streak(){const m=eatenDates();const d=new Date();if(!m[dkey(d)])d.setDate(d.getDate()-1);let n=0;while(m[dkey(d)]){n++;d.setDate(d.getDate()-1)}return n}
function xpTotal(){return eatenCount()*10+cleanDays()*25+Math.min(S.meals.length,GOAL)*5+(S.plan?20:0)+(S.game.market?5:0)+Object.keys(S.game.chests||{}).length*50+Math.min(S.meals.filter(m=>m.surprise).length,10)*5}

 {id:'bite',name:'First Bite',desc:'Tick off your first meal',art:'assets/coffee.png',ok:()=>eatenCount()>=1},

function runQ(){
  if(popBusy||!popQ.length)return;popBusy=true;const b=popQ.shift();
  const el=document.createElement('div');el.className='badgepop';el.setAttribute('role','status');
  el.innerHTML=`<img src="${b.art}" alt=""><div><small>Badge unlocked</small><b>${esc(b.name)}</b><span>${esc(b.desc)}</span></div>`;
  document.body.appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>{el.remove();popBusy=false;runQ()},300)},2800);
}
function confetti(n){
  if(reduced())return;n=n||100;
  const c=document.createElement('canvas');c.className='confetti';document.body.appendChild(c);
  const ctx=c.getContext&&c.getContext('2d');if(!ctx){c.remove();return}
  const dpr=Math.min(2,window.devicePixelRatio||1);const W=c.width=Math.round(innerWidth*dpr),H=c.height=Math.round(innerHeight*dpr);
  const cols=['#F1AB1A','#D94120','#07B670','#E5399B','#4B5BE0','#F5C518'];
  const ps=Array.from({length:n},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.38,vx:(Math.random()-.5)*14*dpr,vy:(-Math.random()*13-4)*dpr,w:(6+Math.random()*6)*dpr,h:(4+Math.random()*5)*dpr,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.random()*cols.length|0]}));
  let t=0;
  (function f(){t++;ctx.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.45*dpr;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()});if(t<130)requestAnimationFrame(f);else c.remove()})();
}
function xpPop(el,text){
  if(!el||!el.getBoundingClientRect)return;
  const r=el.getBoundingClientRect();const e=document.createElement('div');e.className='xppop';e.textContent=text;
  e.style.left=(r.left+r.width/2)+'px';e.style.top=r.top+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),1100);
}
function track(fn,el){
  const l0=levelOf(xpTotal()),x0=xpTotal();fn();const x1=xpTotal();
  if(el&&x1!==x0)xpPop(el,(x1>x0?'+':'')+(x1-x0)+' XP');
  if(levelOf(x1)>l0)setTimeout(()=>levelUp(levelOf(x1)),700);
  awardBadges();
}
function levelUp(l){
  confetti(150);

}

function goalHtml(){
  const n=S.meals.length;const pct=Math.min(100,Math.round(n/GOAL*100));
  return `<div class="bar"><i style="width:${pct}%"></i></div><div class="gt"><span>${n>=GOAL?'<b>Menu unlocked. Plenty to work with.</b>':n+' of '+GOAL+' meals'}</span><span>${n>=GOAL?'+'+(Math.min(n,GOAL)*5)+' XP earned':'Add '+(GOAL-n)+' more for a varied week'}</span></div>`;
}
function coachLine(ts,dk){
  const st=streak();
  if(!eatenCount())return {h:'Welcome to your first week!',p:"Tick the circle on today's meals as you eat them to earn XP and build a streak."};
  const left=ts.filter(t=>!S.game.eaten[dk+'|'+t.id]&&!skippedOn(dk,t.id));
  if(!left.length)return {h:'Clean plate! You cleared today.',p:st>1?'That is a '+st+'-day streak. Come back tomorrow to keep it going.':'Come back tomorrow to start a streak.'};
  const now=new Date();const mins=now.getHours()*60+now.getMinutes();
  const toM=x=>{const q=x.split(':').map(Number);return q[0]*60+q[1]};
  const next=left.find(t=>toM(t.to)>=mins)||left[0];
  const id=S.plan&&S.plan[next.id]&&S.plan[next.id][(now.getDay()+6)%7];const m=id&&mealById(id);
  return {h:'Up next: '+(m?m.name:next.name),p:next.name+' is at '+fmt(next.from)+'. '+(left.length===ts.length?'Eat all '+ts.length+' today for +25 bonus XP.':left.length+' left for a clean plate.')};
}
function gamePanel(ts,dates,todayIdx){
  const xp=xpTotal(),lv=levelOf(xp),into=xp%XP_PER_LEVEL;
  const next=LEVELS[Math.min(lv,LEVELS.length-1)];
  const st=streak(),em=eatenDates();
  const dots=dates.map((d,i)=>`<span class="sd ${em[dkey(d)]?'on':''} ${i===todayIdx?'now':''}" title="${DAYS[i]}">${DAYS[i][0]}</span>`).join('');
  let planned=0,done=0;
  ts.forEach(t=>dates.forEach((d,i)=>{if(hasMeal(t.id,i)){planned++;if(S.game.eaten[dkey(d)+'|'+t.id])done++}}));
  const pct=planned?done/planned:0,C=2*Math.PI*26;
  const dk=dkey(dates[todayIdx]);const q=coachLine(ts,dk);
  const pips=ts.map(t=>`<span class="pip ${S.game.eaten[dk+'|'+t.id]?'on':''}" title="${esc(t.name)}">${ART[t.art]}</span>`).join('');
  const got=BADGES.filter(b=>S.game.badges[b.id]);
  const stack=BADGES.slice(0,4).map(b=>`<img class="${S.game.badges[b.id]?'':'lock'}" src="${b.art}" alt="">`).join('');
  return `<div class="stats">
   <div class="sc lv"><div style="flex:1;min-width:0"><small>Level ${lv}</small><div class="big">${esc(levelName(lv))}</div><div class="bar"><i style="width:${into}%"></i></div><div class="xt">${into} / ${XP_PER_LEVEL} XP · ${XP_PER_LEVEL-into} to ${esc(next)}</div></div></div>
   <div class="sc"><div class="flamebig">${ART.flame}</div><div><small>Streak</small><div class="big">${st} ${st===1?'day':'days'}</div><div class="sdots">${dots}</div></div></div>
   <div class="sc"><div class="ring"><svg viewBox="0 0 62 62" width="62" height="62"><circle cx="31" cy="31" r="26" fill="none" stroke="#F1E3C2" stroke-width="7"/><circle cx="31" cy="31" r="26" fill="none" stroke="#F1AB1A" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-pct)).toFixed(1)}" transform="rotate(-90 31 31)"/></svg><b>${done}/${planned}</b></div><div><small>This week</small><div class="big">${planned?Math.round(pct*100):0}%</div><div class="xt">of meals eaten</div></div></div>
  </div>
  <div class="quest"><img class="mas" src="assets/tomatoes.png" alt=""><div class="txt"><span class="ql">Today's quest</span><b>${esc(q.h)}</b><span class="p">${esc(q.p)}</span><div class="pips">${pips}<span class="xt" style="margin-left:6px">+25 XP for a clean plate</span></div></div><button class="bbtn" data-act="badges"><span class="bstack">${stack}</span>${got.length}/${BADGES.length} badges</button></div>`;
}
function spinCells(){
  const cols=Math.max(1,activeTypes().length);const names=S.meals.map(m=>m.name);if(!names.length)return;
  [...document.querySelectorAll('.chip2 .cname b[data-final], .gc .gcm .m[data-final]')].forEach((el,i)=>{
    const fin=el.dataset.final;const end=450+(i%cols)*180+Math.floor(i/cols)*40;const t0=performance.now();
    el.classList.add('rolling');
    (function tick(){if(performance.now()-t0>=end||!document.body.contains(el)){el.textContent=fin;el.classList.remove('rolling');return}el.textContent=names[Math.random()*names.length|0];setTimeout(tick,70)})();
  });
}

  const act=activeTypes();if(!act.length)return false;

  let c=[];tt.forEach(ty=>c=c.concat(cells(ty)));

  if(id===NONE)return `<div class="chip2 empty skip ${state}" style="--i:${i}"><button class="cname" data-act="swap" data-t="${t.id}" data-d="${d}" aria-label="No ${esc(t.name.toLowerCase())}, change"><span class="tx"><b>No ${esc(t.name.toLowerCase())}</b><small>Skipping this one</small></span></button></div>`;
  if(!m)return `<div class="chip2 empty ${state}" style="--i:${i}"><button class="cname" data-act="swap" data-t="${t.id}" data-d="${d}"><span class="tx"><b>+ Add ${esc(t.name.toLowerCase())}</b></span></button></div>`;
  const k=dk+'|'+t.id;const done=!!S.game.eaten[k];
  let eat='';
  if(state==='today'||(state==='past'&&done)){
    eat=`<button class="eat ${done?'on':''} ${UI.pop===k?'pop':''}" data-act="eat" data-t="${t.id}" data-dk="${dk}" ${state==='past'?'disabled':''} aria-pressed="${done}" aria-label="${done?'Mark as not eaten':'Mark as eaten'}: ${esc(m.name)}">${TICK}</button>`;
  }
  const cnt=S.plan[t.id].filter(x=>x===id).length;
  const pair=PAIR.find(p=>p[0].test(m.name.toLowerCase()));
  const tag=m.surprise?`<span class="tag sp">Surprise!</span>`:(pair&&!seen.has(id)?`<span class="tag">Try with ${pair[1]}!</span>`:'');
  const rl=m.recipe?`<a class="rlink" href="${esc(m.recipe)}" target="_blank" rel="noopener noreferrer" aria-label="Open recipe for ${esc(m.name)} (new tab)" title="Recipe">↗</a>`:'';
  seen.add(id);
  return `<div class="chip2 ${done?'done':''} ${state}" style="--i:${i}">${eat}<button class="cname" data-act="swap" data-t="${t.id}" data-d="${d}" aria-label="${esc(m.name)}, change meal">${ART[t.art]}<span class="tx"><b data-final="${esc(m.name)}">${esc(m.name)}</b><small><span>${esc(t.name)} · ${fmt(t.from)}</span>${cnt>=2?`<span class="fl">${ART.flame} ${cnt}x</span>`:''}${tag}</small></span></button>${rl}</div>`;
}
function stopHtml(d,ts,dates,todayIdx,seenMap,counter){
  const state=d<todayIdx?'past':d===todayIdx?'today':'future';const dk=dkey(dates[d]);
  const chips=ts.map(t=>chipHtml(t,d,seenMap[t.id],dk,state,counter.i++)).join('');
  const doneAll=ts.length>0&&ts.some(t=>S.game.eaten[dk+'|'+t.id])&&ts.every(t=>S.game.eaten[dk+'|'+t.id]||S.plan[t.id]&&S.plan[t.id][d]===NONE);
  const ncls=state==='future'?'future':state==='today'?(doneAll?'done':'today'):(doneAll?'done':'past');
  const icon=state==='future'?NLOCK:doneAll?NCHECK:state==='today'?NSTAR:NDOT;
  const bubble=state==='today'?`<div class="bubble">${NFLAG}<span>${doneAll?'Nice one!':'Eat here!'}</span></div>`:'';
  return `<section class="stop ${d%2===0?'L':'R'} ${state}" aria-label="${DAYS[d]} ${dates[d].getDate()}"><div class="node">${bubble}<button class="nbtn ${ncls}" data-act="node" data-state="${state}" data-day="${DAYS[d]}" aria-label="${DAYS[d]} ${dates[d].getDate()}">${icon}</button><span class="dlabel">${DAYS[d]} ${dates[d].getDate()}</span></div><div class="chips2">${chips}</div></section>`;
}
function weekStats(ts,dates){
  let planned=0,done=0;
  ts.forEach(t=>dates.forEach((d,i)=>{if(hasMeal(t.id,i)){planned++;if(S.game.eaten[dkey(d)+'|'+t.id])done++}}));
  return {planned,done,need:Math.ceil(planned*0.7)};
}
function chestHtml(ts,dates){
  const w=weekStats(ts,dates);const wk=dkey(dates[0]);
  const claimed=!!(S.game.chests||{})[wk];const ready=!claimed&&w.planned>0&&w.done>=w.need;
  const st=claimed?'claimed':ready?'ready':'locked';
  const label=claimed?'Reward claimed':ready?'Open your chest':w.done+'/'+w.need+' meals to unlock';
  return `<section class="stop chest"><div class="node cn"><button class="nbtn chestbtn ${st}" data-act="chest" data-state="${st}" data-wk="${wk}" aria-label="Weekly reward chest: ${label}">${CHEST}</button><span class="dlabel">${label}</span></div></section>`;
}
function fab(act,label,icon,cls){return `<button class="fab ${cls||''}" data-act="${act}" aria-label="${label}" title="${label}">${FABICON[icon]}<span>${label}</span></button>`}
function mapHtml(ts,dates,todayIdx){
  const th=S.theme||'meadow';const seenMap={};ts.forEach(t=>seenMap[t.id]=new Set());const counter={i:0};
  const stops=DAYS.map((_,d)=>stopHtml(d,ts,dates,todayIdx,seenMap,counter)).join('')+chestHtml(ts,dates);
  const N=8,kinds=THEME_DECOR[th]||THEME_DECOR.meadow,dec=[];
  for(let i=0;i<N;i++){[0,1].forEach(side=>{const kind=kinds[(i*2+side)%kinds.length];const top=((i+.12+(side?.42:0)+((i*37+side*11)%10)/55)/N*100).toFixed(1);const edge=1+((i*5+side*3)%9);dec.push(`<span class="dc" style="top:${top}%;${side?'right':'left'}:${edge}%;width:${DECOR_W[kind]}px">${DECOR[kind]}</span>`)})}
  const fmtD=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  const lv=levelOf(xpTotal());
  return `<div class="scene" data-theme="${th}">
   <div class="decor" aria-hidden="true">${dec.join('')}</div>
   <div class="critters" aria-hidden="true"></div>
   <div class="fabs"><div class="fabcol">${fab('surprise','Surprise','gift','pri')}${fab('wheel','Spin','wheel')}${fab('market','Market','market')}${fab('addMealOpen','Add meal','add')}${fab('shuffle','Shuffle','dice')}${fab('badges','Badges','trophy')}${fab('theme','Theme','theme')}</div></div>
   <div class="hud"><span class="pill">Lv ${lv}</span><span class="pill">Your week · ${fmtD(dates[0])} – ${fmtD(dates[6])}</span><span class="pill">${ART.flame} ${streak()}</span></div>
   <div class="mapwrap"><svg id="pathsvg" class="pathsvg" aria-hidden="true"></svg>${stops}</div>
  </div>`;
}
let ro=null,pathT=0;
function drawPath(){
  const wrap=$('.mapwrap'),svg=$('#pathsvg');if(!wrap||!svg)return;
  const r=wrap.getBoundingClientRect();if(!r.width)return;
  const pts=[...wrap.querySelectorAll('.nbtn')].map(b=>{const q=b.getBoundingClientRect();return [q.left-r.left+q.width/2,q.top-r.top+q.height/2]});
  if(pts.length<2)return;
  let d='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],my=(a[1]+b[1])/2;d+=' C'+a[0].toFixed(1)+' '+my.toFixed(1)+' '+b[0].toFixed(1)+' '+my.toFixed(1)+' '+b[0].toFixed(1)+' '+b[1].toFixed(1)}
  svg.setAttribute('viewBox','0 0 '+r.width+' '+r.height);svg.setAttribute('width',r.width);svg.setAttribute('height',r.height);
  svg.innerHTML=`<path d="${d}" fill="none" stroke="var(--path-edge)" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="var(--path)" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="var(--stone)" stroke-width="15" stroke-linecap="round" stroke-dasharray="0.1 40" opacity=".95"/>`;
}
function schedulePath(){if(window.cancelAnimationFrame)cancelAnimationFrame(pathT);pathT=window.requestAnimationFrame?requestAnimationFrame(drawPath):0}
window.addEventListener('resize',schedulePath);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(schedulePath);

function plainCell(t,d,seen,state,dk){
  const id=S.plan[t.id]&&S.plan[t.id][d];const m=id&&mealById(id);const last=d===6?'last':'';
  if(id===NONE)return `<div class="gc skip ${last}"><button class="gcm" data-act="swap" data-t="${t.id}" data-d="${d}" aria-label="No meal, change"><span class="m add">No meal</span><span class="meta">Skipping this one</span></button></div>`;
  if(!m)return `<div class="gc ${last}"><button class="gcm" data-act="swap" data-t="${t.id}" data-d="${d}"><span class="m add">+ Add a meal</span></button></div>`;
  const k=dk+'|'+t.id;const done=!!S.game.eaten[k];
  const eat=(state==='today'||(state==='past'&&done))?`<span class="eatw"><button class="eat ${done?'on':''} ${UI.pop===k?'pop':''}" data-act="eat" data-t="${t.id}" data-dk="${dk}" ${state==='past'?'disabled':''} aria-pressed="${done}" aria-label="${done?'Mark as not eaten':'Mark as eaten'}: ${esc(m.name)}">${TICK}</button></span>`:'';
  const cnt=S.plan[t.id].filter(x=>x===id).length;
  const pair=PAIR.find(p=>p[0].test(m.name.toLowerCase()));
  const tag=m.surprise?`<span class="tag sp">Surprise!</span>`:(pair&&!seen.has(id)?`<span class="tag">Try with ${pair[1]}!</span>`:'');
  seen.add(id);
  const rl=m.recipe?`<a class="rlink" href="${esc(m.recipe)}" target="_blank" rel="noopener noreferrer" aria-label="Open recipe for ${esc(m.name)} (new tab)" title="Recipe">↗</a>`:'';
  return `<div class="gc ${done?'done':''} ${last}">${eat}<button class="gcm" data-act="swap" data-t="${t.id}" data-d="${d}" aria-label="${esc(m.name)}, change meal"><span class="m" data-final="${esc(m.name)}">${esc(m.name)}</span><span class="meta">${tag}${cnt>=2?`<span>${ART.flame}</span>`:''}<span>${ART.repeat} ${cnt}x this week</span></span></button>${rl}</div>`}
function plainGrid(ts,dates,todayIdx){
  const cols=`110px repeat(${ts.length},minmax(210px,1fr))`;
  const seenMap={};ts.forEach(t=>seenMap[t.id]=new Set());let rows='';
  DAYS.forEach((dn,d)=>{const state=d<todayIdx?'past':d===todayIdx?'today':'future';const dk=dkey(dates[d]);
    rows+=`<div class="row ${d===todayIdx?'today':''}" style="display:contents"><div class="gd ${d===6?'last':''}"><b>${dn}</b><span class="num">${dates[d].getDate()}</span></div>${ts.map(t=>plainCell(t,d,seenMap[t.id],state,dk)).join('')}</div>`});
  const heads=ts.map(t=>`<div class="gh"><div style="width:26px;height:26px">${ART[t.art]}</div><div><div class="n">${esc(t.name)}</div><div class="t">${fmt(t.from)} - ${fmt(t.to)}</div></div></div>`).join('');
  const seen2={};ts.forEach(t=>seen2[t.id]=new Set());
  const list=DAYS.map((dn,d)=>{const state=d<todayIdx?'past':d===todayIdx?'today':'future';const dk=dkey(dates[d]);
    return `<div class="pday ${d===todayIdx?'today':''}"><h4>${dn}<span>${dates[d].getDate()}</span></h4>${ts.map(t=>`<div class="prow"><div class="plab"><b>${esc(t.name)}</b>${fmt(t.from)}</div>${plainCell(t,d,seen2[t.id],state,dk).replace(/ last"/,'"')}</div>`).join('')}</div>`}).join('');
  return `<div class="scroller"><div class="grid" style="grid-template-columns:${cols}"><div class="gh" style="border-left:0"></div>${heads}${rows}</div></div><div class="plist">${list}</div>`}

function marketModal(){
  const need={};
  activeTypes().forEach(t=>(S.plan[t.id]||[]).forEach(id=>{
    const m=mealById(id);if(!m)return;
    const n=m.name.toLowerCase();const got=new Map();
    ING.forEach(([re,items])=>{if(re.test(n))items.forEach(([name,cat])=>got.set(name,cat))});
    if(!got.size)got.set(m.name,'Other');
    got.forEach((cat,name)=>{const k=cat+'|'+name;need[k]=(need[k]||0)+1});
  }));
  const by={};Object.keys(need).forEach(k=>{const [cat,name]=k.split('|');(by[cat]=by[cat]||[]).push([name,need[k]])});
  const body=CAT_ORDER.filter(c=>by[c]).map(c=>`<h4>${c}</h4>`+by[c].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).map(([n,k])=>`<label><input type="checkbox"><span>${esc(n)}</span><small>${k} ${k===1?'meal':'meals'}</small></label>`).join('')).join('');
  window.__list=CAT_ORDER.filter(c=>by[c]).map(c=>c+'\n'+by[c].map(([n,k])=>`- ${n} (${k})`).join('\n')).join('\n\n');
  openModal(`<h2>Market list</h2><p>Everything you need for this week's plan.</p><div class="ml">${body||'<p>Add some meals first.</p>'}</div><div class="row"><button class="btn" data-act="copyList">Copy list</button><button class="btn pri" data-act="closeModal">Done</button></div>`);
}

  const cur=UI.wrot||0;const tgt=360*(Math.ceil(cur/360)+5)-(i+.5)*seg+(Math.random()-.5)*seg*.6;UI.wrot=tgt;
  const sv=$('#wheelsvg'),res=$('#wres');if(res)res.textContent='Spinning...';
  document.querySelectorAll('[data-act^="wheel"]').forEach(b=>b.disabled=true);
  const fin=()=>{UI.spinning=false;const r=$('#wres');if(!r)return;r.innerHTML=`Eat <b>${esc(w[i])}</b>!<small>The wheel has spoken.</small>`;document.querySelectorAll('[data-act^="wheel"]').forEach(b=>b.disabled=false);confetti(80)};
  if(sv){if(reduced()){sv.style.transition='none';sv.style.transform='rotate('+tgt+'deg)';fin()}else{sv.style.transform='rotate('+tgt+'deg)';setTimeout(fin,4300)}}else fin();
 },
 surprise(el){UI.sur=null;if(!doSurprise())return;render();surpriseModal()},
 reroll(){undoSurprise();if(!doSurprise()){render();return}render();surpriseModal()},
 market(){track(()=>{S.game.market=true;save()});marketModal()},
 copyList(){const t=window.__list||'';try{navigator.clipboard.writeText(t).then(()=>toast('List copied'),()=>toast('Select the list to copy'))}catch(e){toast('Select the list to copy')}},
 closeModal,
 node(el){const st=el.dataset.state;if(st==='future')toast(el.dataset.day+" unlocks later this week");else if(st==='today')toast("Tick your meals as you eat them");else toast("Nice work, keep it going")},
 chest(el){const st=el.dataset.state;if(st==='locked'){toast("Eat more of your planned meals to unlock it");return}if(st==='claimed'){toast("You already opened this week's chest");return}
  track(()=>{S.game.chests=S.game.chests||{};S.game.chests[el.dataset.wk]=true;save()},el);confetti(170);render();toast('Chest opened! +50 XP')},
 theme(){openModal(`<h2>Choose a theme</h2><p>Pick the world your week lives in.</p><div class="tgrid">${THEMES.map(t=>`<button class="tcardx ${(S.theme||'meadow')===t.id?'cur':''}" data-act="setTheme" data-id="${t.id}"><span class="sw" style="background:linear-gradient(180deg,${t.c[0]},${t.c[1]})"></span>${t.name}</button>`).join('')}</div><div class="row"><button class="btn pri" data-act="closeModal">Done</button></div>`)},
 setTheme(el){S.theme=el.dataset.id;save();closeModal();render()},
 eat(el){
  const t=el.dataset.t,dk=el.dataset.dk;const k=dk+'|'+t;const was=!!S.game.eaten[k];const cd0=cleanDays();
  track(()=>{if(was)delete S.game.eaten[k];else S.game.eaten[k]=true;save()},el);
  if(!was&&cleanDays()>cd0){confetti(120);toast('Clean plate! +25 XP bonus')}
  UI.pop=was?null:k;render()},
 badges(){
  const got=BADGES.filter(b=>S.game.badges[b.id]).length;
  openModal(`<h2>Badges</h2><p>${got} of ${BADGES.length} unlocked.</p><div class="bgrid">${BADGES.map(b=>{const on=!!S.game.badges[b.id];return `<div class="bcard ${on?'':'lock'}"><img src="${b.art}" alt=""><b>${esc(b.name)}</b><span>${esc(b.desc)}</span></div>`}).join('')}</div><div class="row"><button class="btn pri" data-act="closeModal">Close</button></div>`)},
 bell(){toast('No new notifications')},
 avatarMenu(){UI.pm=!UI.pm;render()},
 editTimes(){UI.pm=false;S.step='times';save();render()},
 editMeals(){UI.pm=false;S.step='foods';UI.selTypes=[];save();render()},
 signout(){UI.pm=false;try{localStorage.removeItem(KEY)}catch(e){}S={step:'signup',user:null,types:clone(DEFAULT_TYPES),meals:[],plan:null,game:{eaten:{},badges:{},market:false,shuffles:0}};UI={selTypes:[],menu:false,pm:false,err:{}};render()}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el){let ch=false;if(UI.menu&&!e.target.closest('.menu')){UI.menu=false;ch=true;if(S.step==='foods')refreshMenu()}if(UI.pm&&!e.target.closest('.pm')){UI.pm=false;if(S.step==='plan')render()}return}
  const fn=A[el.dataset.act];
  if(el.dataset.act!=='avatarMenu'&&el.dataset.act!=='typeMenu'&&UI.pm&&S.step==='plan'&&!['editTimes','editMeals','signout'].includes(el.dataset.act)){UI.pm=false}
  fn&&fn(el,e);
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='signup')return;e.preventDefault();
  const em=$('#em').value.trim(),pw=$('#pw').value;UI.em=em;UI.err={};
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))UI.err.em='Enter a valid email address.';
  if(pw.length<6)UI.err.pw='Use at least 6 characters.';
  if(UI.err.em||UI.err.pw){render();return}
  S.user={email:em};S.step='times';save();render();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.time){const ty=typeById(t.dataset.id);ty[t.dataset.time]=t.value;if(!ty.on){ty.on=true;const c=t.closest('.tcard');c&&c.classList.add('on');}save()}
  if(t.dataset.name){typeById(t.dataset.name).name=t.value||'Snack';save()}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='mealin'){e.preventDefault();addFood()}});

/* validate saved state, then draw */
(function init(){
  S.game=S.game||{eaten:{},badges:{},market:false,shuffles:0};
  S.game.chests=S.game.chests||{};
  if(S.step==='plan')UI.reveal=true;
  if(S.step==='plan'&&(!S.plan||!S.meals.length)){S.step=S.meals.length?'plan':'times'}
  if(S.step==='plan'&&!S.plan)generate();
  render();
})();
</script>
